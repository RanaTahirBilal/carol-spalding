<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>Page not found | Carol S. Spalding</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
  :root{ --ink:#1A1F3A; --acc:#2E8B7A; --paper:#F5F2EA; --muted:#5C6B69 }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(158deg,#101A19,#1E3230);color:#F5F2EA;
       font-family:"Source Serif 4",Georgia,serif;padding:24px}
  .w{max-width:52ch;text-align:left}
  p.eyebrow{font-family:Archivo,sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
       color:var(--acc);font-weight:700;margin:0 0 18px}
  h1{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(30px,6vw,56px);line-height:1.05;
       letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
  p.t{font-size:17px;line-height:1.7;color:rgba(245,242,234,.86);margin:0 0 28px}
  a{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;
       font-family:Archivo,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
  a span{width:36px;height:36px;border:1px solid rgba(255,255,255,.45);border-radius:50%;
       display:inline-flex;align-items:center;justify-content:center;transition:.25s}
  a:hover span{background:var(--acc);border-color:var(--acc)}
</style>
</head>
<body>
  <div class="w">
    <p class="eyebrow">Error 404</p>
    <h1>That page is not here.</h1>
    <p class="t">Everything on this site lives on one page, so the front door is the whole building. Try again from the top.</p>
    <a href="/"><span>&rsaquo;</span>Back to the start</a>
  </div>
</body>
</html>
